name: 生成一集冥想

# 手动触发。定时跑的话在下面加 schedule，但建议先手动跑顺了再说 ——
# 定时任务失败时没人看日志，白烧额度。
on:
  workflow_dispatch:
    inputs:
      date:
        description: 日期（留空＝今天，格式 2026-07-30）
        required: false
        default: ""
      brief:
        description: 时段
        required: false
        default: 晚上
        type: choice
        options: [晚上, 中午]
      minutes:
        description: 成品时长（分钟）
        required: false
        default: "10"

jobs:
  generate:
    runs-on: ubuntu-latest
    # 整条流水线实测约 20 分钟；给足余量，卡住时也不会白占 6 小时
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ffmpeg 用 npm 包里自带的（ffmpeg-static / ffprobe-static），
      # 不装系统 ffmpeg —— 版本可控，和本机跑出来的结果一致。
      - name: 安装依赖
        run: npm ci --omit=dev || npm install --omit=dev

      # 封面叠字要 Pillow；Ubuntu 默认没有中文字体，Noto CJK 提供宋体和黑体
      - name: 安装封面依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil fonts-noto-cjk

      - name: 生成
        env:
          # ── 密钥（仓库 Settings → Secrets and variables → Actions → Secrets）──
          TEXT_API_KEY: ${{ secrets.TEXT_API_KEY }}
          MINIMAX_SUBSCRIPTION_KEY: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          # 封面出图用的 SenseNova
          SENSENOVA_API_KEYS: ${{ secrets.SENSENOVA_API_KEYS }}
          # Agnes 主池：提示词 / 生图 / 生视频
          AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
          # 评委和运动导演走的也是 SenseNova，但和封面那批是不同的 key
          SENSENOVA_SCORER_KEYS: ${{ secrets.SENSENOVA_SCORER_KEYS }}
          SENSENOVA_MOTION_KEYS: ${{ secrets.SENSENOVA_MOTION_KEYS }}
          # ── 路径：全部指向仓库内 ──
          MEDITATION_OUTPUT_ROOT: output
          MEDITATION_SKILL_ROOTS: skills
          MEDITATION_BGM_ROOT: assets/bgm
          MEDITATION_VIDEO_ROOT: assets/video
          MEDITATION_COVER_DIR: output/_covers
          AGNES_HEADLESS_ENABLED: "true"
          # runner 在海外，必须走国际站镜像 .com；default-config 里的 .cn 是给
          # 国内本机用的。两个镜像同一批令牌、同一套模型名，只差域名，用错地区
          # 会一直 401。填不带 /v1 的 origin，src/agnes-headless.mjs 自己拼路径。
          # 文档：https://wiki.agnes-ai.com/zh-Hans/docs/overview
          AGNES_BASE_URL: https://apihub.agnes-ai.com
          AGNES_TEXT_MODEL: agnes-2.0-flash
          AGNES_IMAGE_MODEL: agnes-image-2.0-flash
          AGNES_OUTPUT_DIR: output/_agnes
        run: |
          node scripts/run-once.mjs \
            --date "${{ inputs.date }}" \
            --brief "${{ inputs.brief }}" \
            --minutes "${{ inputs.minutes }}"

      # 成品几十上百 MB，走 artifact。默认存 90 天，够你下载了。
      - name: 上传成品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 冥想成品-${{ github.run_number }}
          path: |
            output/**/音频/*.mp3
            output/**/视频/*.mp4
            output/**/封面/*.png
            output/_covers/*.png
            output/**/文本/*.txt
            output/**/文本/*.json
          if-no-files-found: warn
          retention-days: 90
