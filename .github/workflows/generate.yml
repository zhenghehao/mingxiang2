name: 生成一集冥想

# 列表里每条 run 的标题。不设的话所有记录都叫「生成一集冥想」，
# 攒上十几条完全分不清谁是谁 —— 只能一条条点开看。
# 这里只能用表达式，取不到 shell 里算出来的值，所以定时触发（inputs 全空）
# 显示成「定时」，具体时段在 artifact 名字里能看到。
run-name: 冥想 ${{ inputs.date || '今天' }} · ${{ inputs.brief || '定时' }} · ${{ inputs.minutes || '10' }}分钟

on:
  workflow_dispatch:
    inputs:
      date:
        description: 日期（留空＝今天，格式 2026-07-30）
        required: false
        default: ""
      brief:
        description: 时段
        required: false
        default: 晚上
        type: choice
        options: [晚上, 中午]
      minutes:
        description: 成品时长（分钟）
        required: false
        default: "10"

  # 定时。cron 只负责「按点敲门」，开不开由下面的 AUTO_RUN 变量决定 ——
  # 这样控制台上的「开始/停止」按钮才是真开关：不用改这个文件就能停。
  #
  # 改频率就改这一行（UTC 时间）：
  #   0 */2 * * *  每 2 小时（约 12 集/天）
  #   0 */6 * * *  每 6 小时（4 集/天）
  #   0 13 * * *   每天一次，UTC 13:00 ＝ 北京时间 21:00
  schedule:
    - cron: "0 */2 * * *"

# 同一时刻只允许一条在跑。定时和手动撞在一起时，后来的排队而不是并行 ——
# 两条同时跑会争同一批 API key 的限流窗口，还可能选到同一个题目。
concurrency:
  group: generate-meditation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 手动触发永远放行；定时触发只在 AUTO_RUN=on 时才跑。
    # 关掉时这个 job 直接跳过，不占 runner、不消耗任何额度。
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RUN == 'on'
    # 整条流水线实测约 10 分钟；给足余量，卡住时也不会白占 6 小时
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ffmpeg 用 npm 包里自带的（ffmpeg-static / ffprobe-static），
      # 不装系统 ffmpeg —— 版本可控，和本机跑出来的结果一致。
      - name: 安装依赖
        run: npm ci --omit=dev || npm install --omit=dev

      # 封面叠字要 Pillow；Ubuntu 默认没有中文字体，Noto CJK 提供宋体和黑体
      - name: 安装封面依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil fonts-noto-cjk

      # 背景音来自另一个私有仓库的 Release 附件（zhenghehao/mingxiang2-bgm）。
      #
      # 为什么不放主仓库：180 首合计 1GB，git track 的话每次 checkout 都要拉一遍
      # （现在 checkout 是 2 秒），而且进了 git 历史就删不掉。Release 附件不算
      # git 对象，这里每次只下载**随机挑中的那一首**，3~11MB。
      #
      # 没配 BGM_REPO_TOKEN 也能跑：仓库自带 3 首 CC 协议配乐兜底。
      # 这一步刻意不用 `set -e` 的失败中断 —— 拿不到背景音不该让整集生成失败，
      # 退回自带的那几首就行，日志里会说清楚用的是哪种。
      - name: 取一首背景音
        env:
          BGM_TOKEN: ${{ secrets.BGM_REPO_TOKEN }}
          BGM_REPO: zhenghehao/mingxiang2-bgm
          BGM_TAG: bgm-v1
        run: |
          if [ -z "$BGM_TOKEN" ]; then
            echo "没配 BGM_REPO_TOKEN，用仓库自带的 CC 协议配乐（$(ls assets/bgm/*.mp3 2>/dev/null | wc -l) 首）"
            exit 0
          fi
          export GH_TOKEN="$BGM_TOKEN"
          names=$(gh release view "$BGM_TAG" --repo "$BGM_REPO" --json assets \
                    --jq '.assets[].name | select(endswith(".mp3"))' 2>/dev/null || true)
          if [ -z "$names" ]; then
            echo "⚠ 读不到 $BGM_REPO 的 release $BGM_TAG（token 权限？tag 名？），退回自带配乐"
            exit 0
          fi
          count=$(printf '%s\n' "$names" | wc -l | tr -d ' ')
          pick=$(printf '%s\n' "$names" | shuf -n 1)
          echo "背景音库 $count 首，本次随机选中：$pick"
          mkdir -p /tmp/bgmpick
          if gh release download "$BGM_TAG" --repo "$BGM_REPO" -p "$pick" -D /tmp/bgmpick --clobber 2>/dev/null \
             && [ -s "/tmp/bgmpick/$pick" ]; then
            # 对照表把序号翻回原名 —— 成品清单里要能看出这一集用的是哪首曲子
            if gh release download "$BGM_TAG" --repo "$BGM_REPO" -p manifest.json -D /tmp/bgmpick --clobber 2>/dev/null; then
              orig=$(python3 -c "import json,sys; print(json.load(open('/tmp/bgmpick/manifest.json'))['tracks'].get('$pick','(对照表里没有)'))" 2>/dev/null || echo "")
              [ -n "$orig" ] && echo "  原始曲名：$orig"
            fi
            # 下载成功才清掉自带的：失败时那 3 首还得顶上
            rm -f assets/bgm/*.mp3
            mv "/tmp/bgmpick/$pick" assets/bgm/
            echo "  已放入 assets/bgm/（$(du -h "assets/bgm/$pick" | cut -f1)）"
          else
            echo "⚠ 下载 $pick 失败，退回自带配乐"
          fi

      - name: 生成
        env:
          # ── 密钥（仓库 Settings → Secrets and variables → Actions → Secrets）──
          TEXT_API_KEY: ${{ secrets.TEXT_API_KEY }}
          # MiniMax 两种计费模式各读各的 key，实际用哪个由 config.minimax.deliveryMode
          # 决定（2026-08-09 订阅到期，已切成 api＝按量付费）。两个都传着，
          # 将来切回订阅时只改配置、不用动这个文件。
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_SUBSCRIPTION_KEY: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          # 封面出图用的 SenseNova
          SENSENOVA_API_KEYS: ${{ secrets.SENSENOVA_API_KEYS }}
          # Agnes 主池：提示词 / 生图 / 生视频
          AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
          # 运动导演和导演走的也是 SenseNova，但和封面那批是不同的 key。
          # DIRECTOR 是 2026-08-14 新增的（导演从 Agnes 网关挪过来了）；
          # 不填也能跑 —— agnes-headless 里 directorKeys 为空会自动借用 scorerKeys。
          # SCORER 现在只剩这个借用作用：评委那一步已经删掉了。
          SENSENOVA_SCORER_KEYS: ${{ secrets.SENSENOVA_SCORER_KEYS }}
          SENSENOVA_MOTION_KEYS: ${{ secrets.SENSENOVA_MOTION_KEYS }}
          SENSENOVA_DIRECTOR_KEYS: ${{ secrets.SENSENOVA_DIRECTOR_KEYS }}
          # ── 路径：全部指向仓库内 ──
          MEDITATION_OUTPUT_ROOT: output
          MEDITATION_SKILL_ROOTS: skills
          MEDITATION_BGM_ROOT: assets/bgm
          MEDITATION_VIDEO_ROOT: assets/video
          MEDITATION_COVER_DIR: output/_covers
          AGNES_HEADLESS_ENABLED: "true"
          # runner 在海外，必须走国际站镜像 .com；default-config 里的 .cn 是给
          # 国内本机用的。两个镜像同一批令牌、同一套模型名，只差域名，用错地区
          # 会一直 401。填不带 /v1 的 origin，src/agnes-headless.mjs 自己拼路径。
          # 文档：https://wiki.agnes-ai.com/zh-Hans/docs/overview
          AGNES_BASE_URL: https://apihub.agnes-ai.com
          AGNES_TEXT_MODEL: agnes-2.0-flash
          AGNES_IMAGE_MODEL: agnes-image-2.0-flash
          AGNES_OUTPUT_DIR: output/_agnes
        run: |
          # 定时触发时 inputs 全是空的（那些字段只属于 workflow_dispatch），
          # 所以要兜底，否则定时跑会带着空参数进去。
          BRIEF="${{ inputs.brief }}"
          if [ -z "$BRIEF" ]; then
            # 按北京时间分时段：11-17 点出「中午」，其余出「晚上」。
            # runner 是 UTC，北京时间 = UTC + 8。
            H=$(( ( $(date -u +%-H) + 8 ) % 24 ))
            if [ "$H" -ge 11 ] && [ "$H" -lt 17 ]; then BRIEF="中午"; else BRIEF="晚上"; fi
            echo "定时触发：北京时间 ${H} 点 → 时段「${BRIEF}」"
          fi
          DATE="${{ inputs.date }}"
          # 留空＝今天。这里必须按北京时间算，不能用 runner 的 UTC ——
          # UTC 16:00 之后北京已经是第二天，成品名会比实际晚一天。
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          # 传给「上传成品」那一步用：这两个值是在本步骤的 shell 里算出来的，
          # 不写进 GITHUB_ENV 的话下一步拿不到，artifact 名就只剩一个流水号。
          {
            echo "RUN_DATE=$DATE"
            echo "RUN_BRIEF=$BRIEF"
            echo "RUN_CLOCK=$(TZ=Asia/Shanghai date +%H%M)"
          } >> "$GITHUB_ENV"
          node scripts/run-once.mjs \
            --date "${{ inputs.date }}" \
            --brief "$BRIEF" \
            --minutes "${{ inputs.minutes || '10' }}"

      # 成品几十上百 MB，走 artifact。默认存 90 天，够你下载了。
      - name: 上传成品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 名字里带齐「哪天、什么时段、几点跑的、第几次」—— 下载列表里一眼能认出来。
          # 只有流水号的话，攒上十几条就完全分不清谁是谁了。
          # 冒号斜杠等字符 GitHub 不接受，所以用连字符拼。
          name: 冥想成品-${{ env.RUN_DATE }}-${{ env.RUN_BRIEF }}-${{ env.RUN_CLOCK }}-第${{ github.run_number }}次
          path: |
            output/**/音频/*.mp3
            output/**/视频/*.mp4
            output/**/封面/*.png
            output/_covers/*.png
            output/**/文本/*.txt
            output/**/文本/*.json
          if-no-files-found: warn
          retention-days: 90
