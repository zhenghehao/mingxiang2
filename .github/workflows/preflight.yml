name: 体检 · 密钥在 runner 上能不能用

# 完整流水线一次约 20 分钟，密钥不对时会跑到中途才炸，日志还得翻半天。
# 这条只做鉴权探测：每批 key 发一次 max_tokens=4 的最小请求，把 HTTP 状态摊开，
# 30 秒出结果，几乎不消耗额度。改完 Secrets 先跑这条，通了再跑 generate。
on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # check-secrets.mjs 只用内置 fetch，不需要任何依赖，跳过 npm 安装省一分钟。
      - name: 体检
        env:
          TEXT_API_KEY: ${{ secrets.TEXT_API_KEY }}
          MINIMAX_SUBSCRIPTION_KEY: ${{ secrets.MINIMAX_SUBSCRIPTION_KEY }}
          SENSENOVA_API_KEYS: ${{ secrets.SENSENOVA_API_KEYS }}
          SENSENOVA_SCORER_KEYS: ${{ secrets.SENSENOVA_SCORER_KEYS }}
          SENSENOVA_MOTION_KEYS: ${{ secrets.SENSENOVA_MOTION_KEYS }}
          AGNES_API_KEYS: ${{ secrets.AGNES_API_KEYS }}
          # 必须和 generate.yml 一致，否则体检通过了正式跑还是会 401。
          # runner 在海外走 .com，本机在国内走 default-config 里的 .cn。
          AGNES_BASE_URL: https://apihub.agnes-ai.com
        run: node scripts/check-secrets.mjs
